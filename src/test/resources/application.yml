server:
  port: 8888
cors: 
  originPatterns: http://localhost:8080,http://localhost:3000,http://www.erudio.com.br
spring:
  application:
    name: res-with-spring-boot
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
logging:
  level:
    # root: WARN
    '[com.github.zulisses.res_with_spring_boot]': DEBUG
springdoc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    use-root-path: true